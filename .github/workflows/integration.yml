name: Continuous Integration

on: 
  push:
    branches:
      - '**'
jobs:
  Lint-and-Build-and-Test:
    runs-on: ubuntu-latest
    environment: dev
    env:
      WHO_AM_I: ${{ secrets.WHO_AM_I  }}
      hello: ${{ vars.WORLD }}
      github_environment: ${{ vars.WORLD }}
    strategy:
      matrix:
        node-version: [14.x]
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        run: |
          echo "dir=$(yarn cache dir)" >> $GITHUB_OUTPUT
          echo "github.ref_name = ${GITHUB_REF_NAME}"
          echo "github.ref = ${GITHUB_REF}"
          echo "github.event.workflow_run.head_branch = ${HEAD_BRANCH}"
          echo "Vars in env: ${vars}"
        env:
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
      - uses: actions/cache@v3
        id: yarn-cache
        with:
          path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-
      - name: Install App Dependencies
        run: yarn install --frozen-lockfile

      - name: Archive an artifact
        uses: actions/upload-artifact@v4
        with:
          name: resume
          path: |
            dist

      - name: Lint App
        run: |
          echo "Linting app..."
          echo "hello $hello"
          echo "hello $github_environment"
          sleep 10

      - name: Build App
        run: |
          echo "Building app..."
          sleep 10

      - name: Test App
        run: |
          echo "Testing app..."
          sleep 10
          node app.js